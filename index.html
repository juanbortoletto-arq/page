<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="HcmCUkQbzKOSlrsQWDhgqIP61ffIol-sXPuJgyBTbXY" />
    <meta name="description" content="Escritório de arquitetura em Ribeirão Pires e Grande ABC. Projetos residenciais, interiores e gestão de obras com orçamento controlado.">
    <title>Juan Bortoletto Arquitetura | Projetos Residenciais e Gestão de Obras</title>
    <style>
        /* Importação das fontes */
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap');

        :root {
            --navy-blue: #0B192C; 
            --gold-accent: #C8A97E; 
            --off-white: #F4F4F4; 
            --pure-white: #FFFFFF;
            --charcoal: #333333;
            --light-gray: #E0E0E0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Lato', sans-serif;
            font-weight: 300;
            color: var(--charcoal);
            background-color: var(--pure-white);
            line-height: 1.7; 
            padding-top: 80px; 
            -webkit-font-smoothing: antialiased; 
        }

        /* Tipografia rigorosa */
        h1, h2 { font-family: 'Lora', serif; font-weight: 500; color: var(--navy-blue); }
        h3, .subtitle, .logo, .serif { font-family: 'Playfair Display', serif; font-weight: 400; }
        h1 { font-size: 3.2rem; line-height: 1.2; letter-spacing: -0.5px; }
        h2 { font-size: 2.2rem; margin-bottom: 20px; }
        .subtitle { font-size: 1.15rem; color: #555; margin-bottom: 20px; }
        .text-justify { text-align: justify; }

        /* Cabeçalho */
        header {
            position: fixed; top: 0; width: 100%; background-color: var(--pure-white);
            border-bottom: 1px solid var(--light-gray); z-index: 1000; display: flex;
            justify-content: space-between; align-items: center; padding: 20px 40px;
        }

        .logo { font-size: 1.4rem; text-decoration: none; font-weight: 600; letter-spacing: 1px; color: var(--navy-blue); }
        .nav-links { display: flex; align-items: center; }
        .nav-links a { margin-left: 25px; text-decoration: none; color: var(--charcoal); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; transition: color 0.3s; font-weight: 400; }
        .nav-links a:hover { color: var(--gold-accent); }

        .header-instagram {
            margin-left: 20px; display: inline-flex; align-items: center; justify-content: center; transition: transform 0.3s ease;
        }
        .header-instagram:hover { transform: scale(1.15); }
        .header-instagram svg { fill: var(--gold-accent); transition: fill 0.3s; }
        .header-instagram:hover svg { fill: var(--navy-blue); }

        .menu-toggle { display: none; background: none; border: none; font-size: 1.6rem; color: var(--navy-blue); cursor: pointer; padding: 5px; }

        .btn {
            display: inline-block; background-color: var(--navy-blue); color: var(--pure-white);
            padding: 16px 32px; text-decoration: none; font-size: 0.85rem; letter-spacing: 2px;
            text-transform: uppercase; transition: all 0.3s ease; border: 1px solid var(--navy-blue);
            cursor: pointer; font-weight: 400; font-family: 'Lato', sans-serif;
        }
        .btn:hover { background-color: var(--pure-white); color: var(--navy-blue); border-color: var(--navy-blue); }

        /* ========================================= */
        /* NOVO TOPO (HERO) - FUNDO DINÂMICO DEGRADÊ */
        /* ========================================= */
        .hero-lara-style {
            position: relative;
            min-height: 90vh; /* Altura da tela */
            display: flex;
            align-items: center;
            overflow: hidden;
            background-color: var(--off-white);
        }

        /* Container que roda as imagens (100% da tela) */
        .hero-bg-slider {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }
        .hero-slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0; transition: opacity 1.5s ease-in-out;
        }
        .hero-slide.active { opacity: 1; }

        /* Máscara de Degradê (Sólido na esquerda, transparente na direita) */
        .hero-gradient {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            background: linear-gradient(90deg, var(--off-white) 0%, var(--off-white) 45%, rgba(244, 244, 244, 0.5) 70%, rgba(244, 244, 244, 0) 100%);
        }

        /* Conteúdo do Topo restrito à esquerda */
        .hero-container {
            position: relative; z-index: 3;
            width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px;
        }
        
        .hero-text-content { max-width: 600px; } /* Limita o texto para não vazar pra cima da foto */

        .hero-badges { display: flex; gap: 30px; margin: 30px 0; padding-top: 20px; border-top: 1px solid #CCC; }
        .badge-item strong { display: block; font-family: 'Lora', serif; font-size: 1.4rem; color: var(--navy-blue); }
        .badge-item span { font-size: 0.85rem; color: #555; text-transform: uppercase; letter-spacing: 1px; font-family: 'Lato', sans-serif; }

        /* Botão WhatsApp */
        .whatsapp-float {
            position: fixed; width: 60px; height: 60px; bottom: 40px; right: 40px;
            background-color: #25d366; color: #FFF; border-radius: 50px; text-align: center;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2); z-index: 1000; display: flex;
            align-items: center; justify-content: center; text-decoration: none; transition: transform 0.3s ease;
        }
        .whatsapp-float:hover { transform: scale(1.1); }

        .section-padding { padding: 100px 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .text-center { text-align: center; }

        /* Sobre */
        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
        .about-image { width: 100%; max-width: 400px; height: auto; object-fit: cover; border: 1px solid var(--light-gray); padding: 10px; margin: 0 auto; display: block; }
        
        /* Projetos */
        .portfolio { background-color: var(--pure-white); }
        .portfolio-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 40px 0; }
        .portfolio-item { width: 100%; height: 260px; object-fit: cover; transition: transform 0.4s ease; cursor: pointer; border: 1px solid var(--light-gray); }
        .portfolio-item:hover { transform: scale(1.03); }

        /* Especialidades */
        .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 60px; }
        .service-box { background: var(--off-white); padding: 50px 30px; border-top: 3px solid var(--navy-blue); border-left: 1px solid var(--light-gray); border-right: 1px solid var(--light-gray); border-bottom: 1px solid var(--light-gray); }
        .service-box h2 { font-size: 1.4rem; margin-bottom: 20px; border-bottom: 1px solid var(--light-gray); padding-bottom: 20px; }
        .service-list { list-style: none; margin-top: 10px; }
        .service-list li { margin-bottom: 15px; padding-left: 24px; position: relative; font-size: 0.95rem; }
        .service-list li::before { content: '—'; color: var(--gold-accent); position: absolute; left: 0; font-weight: bold; }

        .differentials-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 80px; }
        .diff-box { background-color: var(--navy-blue); color: var(--pure-white); padding: 50px 40px; text-align: left; border-bottom: 3px solid var(--gold-accent); }
        .diff-box h3 { color: var(--gold-accent); font-size: 1.5rem; margin-bottom: 20px; line-height: 1.3; }
        .diff-box p { font-size: 1rem; color: #E0E0E0; font-weight: 300; }

        /* FAQ - Botões em Azul Escuro */
        .faq-section { background-color: var(--off-white); padding: 100px 20px; border
