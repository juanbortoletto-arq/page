<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="HcmCUkQbzKOSlrsQWDhgqIP61ffIol-sXPuJgyBTbXY" />
    <meta name="description" content="Escritório de arquitetura em Ribeirão Pires e Grande ABC. Projetos residenciais, interiores e gestão de obras com orçamento controlado.">
    <title>Juan Bortoletto Arquitetura | Projetos Residenciais e Gestão de Obras</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap');

        :root {
            --navy-blue: #0B192C; 
            --gold-accent: #C8A97E; 
            --off-white: #F4F4F4; 
            --pure-white: #FFFFFF;
            --charcoal: #333333;
            --light-gray: #E0E0E0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Lato', sans-serif;
            font-weight: 300;
            color: var(--charcoal);
            background-color: var(--pure-white);
            line-height: 1.7; 
            padding-top: 80px; 
            -webkit-font-smoothing: antialiased; 
            overflow-x: hidden;
        }

        h1, h2 { font-family: 'Lora', serif; font-weight: 500; color: var(--navy-blue); }
        h3, .subtitle, .logo, .serif { font-family: 'Playfair Display', serif; font-weight: 400; }
        h1 { font-size: 3.2rem; line-height: 1.2; letter-spacing: -0.5px; }
        h2 { font-size: 2.2rem; margin-bottom: 20px; }
        .subtitle { font-size: 1.15rem; color: #555; margin-bottom: 20px; }
        .text-justify { text-align: justify; }

        header {
            position: fixed; top: 0; left: 0; width: 100%; background-color: var(--pure-white);
            border-bottom: 1px solid var(--light-gray); z-index: 1000; display: flex;
            justify-content: space-between; align-items: center; padding: 20px 40px;
        }

        .logo { font-size: 1.4rem; text-decoration: none; font-weight: 600; letter-spacing: 1px; color: var(--navy-blue); }
        .nav-links { display: flex; align-items: center; }
        .nav-links a { margin-left: 25px; text-decoration: none; color: var(--charcoal); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; transition: color 0.3s; font-weight: 400; }
        .nav-links a:hover { color: var(--gold-accent); }

        .header-instagram {
            margin-left: 20px; display: inline-flex; align-items: center; justify-content: center; transition: transform 0.3s ease;
        }
        .header-instagram:hover { transform: scale(1.15); }
        .header-instagram svg { fill: var(--gold-accent); transition: fill 0.3s; }
        .header-instagram:hover svg { fill: var(--navy-blue); }

        .menu-toggle { display: none; background: none; border: none; font-size: 1.6rem; color: var(--navy-blue); cursor: pointer; padding: 5px; }

        .btn {
            display: inline-block; background-color: var(--navy-blue); color: var(--pure-white);
            padding: 16px 32px; text-decoration: none; font-size: 0.85rem; letter-spacing: 2px;
            text-transform: uppercase; transition: all 0.3s ease; border: 1px solid var(--navy-blue);
            cursor: pointer; font-weight: 400; font-family: 'Lato', sans-serif;
        }
        .btn:hover { background-color: var(--pure-white); color: var(--navy-blue); border-color: var(--pure-white); }

        /* TOPO (HERO) COM DEGRADÊ E IMAGENS */
        .hero-lara-style {
            position: relative;
            min-height: 90vh;
            display: flex;
            align-items: center;
            background-color: var(--off-white);
        }

        .hero-bg-slider {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            background-color: var(--off-white);
        }
        
        .hero-slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0; transition: opacity 1.5s ease-in-out;
        }
        .hero-slide.active { opacity: 1; }

        .hero-gradient {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            background: linear-gradient(90deg, var(--off-white) 0%, var(--off-white) 45%, rgba(244, 244, 244, 0.6) 70%, rgba(244, 244, 244, 0) 100%);
        }

        .hero-container {
            position: relative; z-index: 3;
            width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px;
        }
        
        .hero-text-content { max-width: 600px; }

        .hero-badges { display: flex; flex-wrap: wrap; gap: 30px; margin: 30px 0; padding-top: 20px; border-top: 1px solid #CCC; }
        .badge-item strong { display: block; font-family: 'Lora', serif; font-size: 1.4rem; color: var(--navy-blue); }
        .badge-item span { font-size: 0.85rem; color: #555; text-transform: uppercase; letter-spacing: 1px; font-family: 'Lato', sans-serif; }

        .whatsapp-float {
            position: fixed; width: 60px; height: 60px; bottom: 40px; right: 40px;
            background-color: #25d366; color: #FFF; border-radius: 50px; text-align: center;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2); z-index: 1000; display: flex;
            align-items: center; justify-content: center; text-decoration: none; transition: transform 0.3s ease;
        }
        .whatsapp-float:hover { transform: scale(1.1); }

        .section-padding { padding: 100px 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .text-center { text-align: center; }

        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
        .about-image { width: 100%; max-width: 400px; height: auto; object-fit: cover; border: 1px solid var(--light-gray); padding: 10px; margin: 0 auto; display: block; }
        
        .portfolio { background-color: var(--pure-white); }
        .portfolio-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 40px 0; }
        .portfolio-item { width: 100%; height: 260px; object-fit: cover; transition: transform 0.4s ease; cursor: pointer; border: 1px solid var(--light-gray); }
        .portfolio-item:hover { transform: scale(1.03); }

        .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 60px; }
        .service-box { background: var(--off-white); padding: 50px 30px; border-top: 3px solid var(--navy-blue); border-left: 1px solid var(--light-gray); border-right: 1px solid var(--light-gray); border-bottom: 1px solid var(--light-gray); }
        .service-box h2 { font-size: 1.4rem; margin-bottom: 20px; border-bottom: 1px solid var(--light-gray); padding-bottom: 20px; }
        .service-list { list-style: none; margin-top: 10px; }
        .service-list li { margin-bottom: 15px; padding-left: 24px; position: relative; font-size: 0.95rem; }
        .service-list li::before { content: '—'; color: var(--gold-accent); position: absolute; left: 0; font-weight: bold; }

        .differentials-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 80px; }
        .diff-box { background-color: var(--navy-blue); color: var(--pure-white); padding: 50px 40px; text-align: left; border-bottom: 3px solid var(--gold-accent); }
        .diff-box h3 { color: var(--gold-accent); font-size: 1.5rem; margin-bottom: 20px; line-height: 1.3; }
        .diff-box p { font-size: 1rem; color: #E0E0E0; font-weight: 300; }

        .faq-section { background-color: var(--off-white); padding: 100px 20px; border-top: 1px solid var(--light-gray); }
        .faq-container { max-width: 800px; margin: 40px auto 0; }
        .faq-item { background: var(--pure-white); border: 1px solid var(--light-gray); margin-bottom: 15px; padding: 20px 25px; transition: all 0.3s; }
        .faq-question { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--navy-blue); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
        .faq-answer { display: none; margin-top: 15px; font-size: 0.95rem; color: #555; border-top: 1px solid var(--off-white); padding-top: 15px; text-align: justify; }
        .faq-item.active .faq-answer { display: block; }
        .faq-toggle { font-size: 1.4rem; color: var(--navy-blue); font-weight: 700; }

        /* FORMULÁRIO EM AZUL ESCURO */
        .contact-section { background-color: var(--navy-blue); color: var(--pure-white); padding: 100px 20px; }
        .form-card { background: var(--navy-blue); padding: 50px 40px; max-width: 850px; margin: 0 auto; border: 1px solid rgba(255, 255, 255, 0.15); }
        
        .step-panel { display: none; }
        .step-panel.active { display: block; }

        .form-title { margin-bottom: 10px; line-height: 1.2; text-transform: uppercase; color: var(--pure-white) !important; }
        .form-subtitle { color: #A0B0C0; margin-bottom: 30px; font-size: 1.05rem; }

        .choice-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .choice-btn {
            padding: 20px; border: 1px solid rgba(255, 255, 255, 0.4); background: transparent; color: var(--pure-white);
            font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
            cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: space-between;
        }
        .choice-btn.primary { background: var(--gold-accent); color: var(--navy-blue); border-color: var(--gold-accent); }
        .choice-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .choice-btn.primary:hover { background: var(--pure-white); color: var(--navy-blue); border-color: var(--pure-white); }

        .input-group { margin-bottom: 25px; text-align: left; }
        .input-label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; color: var(--gold-accent); margin-bottom: 8px; }
        
        .line-input {
            width: 100%; padding: 12px 0; border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.3); background: transparent;
            font-family: 'Lato', sans-serif; font-size: 1rem; color: var(--pure-white); outline: none; transition: border-color 0.3s;
        }
        .line-input::placeholder { color: rgba(255, 255, 255, 0.4); }
        .line-input:focus { border-bottom-color: var(--gold-accent); }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }

        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 25px 0; }
        .city-card {
            padding: 18px 12px; background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); text-align: center;
            font-size: 0.9rem; color: var(--pure-white); cursor: pointer; transition: all 0.3s;
        }
        .city-card:hover, .city-card.selected { background: var(--gold-accent); color: var(--navy-blue); border-color: var(--gold-accent); }

        .btn-form {
            display: inline-block; background-color: var(--gold-accent); color: var(--navy-blue);
            padding: 16px 32px; text-decoration: none; font-size: 0.85rem; letter-spacing: 2px;
            text-transform: uppercase; transition: all 0.3s ease; border: 1px solid var(--gold-accent);
            cursor: pointer; font-weight: 700; font-family: 'Lato', sans-serif; width: 100%; margin-top: 20px;
        }
        .btn-form:hover { background-color: var(--pure-white); color: var(--navy-blue); border-color: var(--pure-white); }

        footer { background-color: var(--navy-blue); padding: 50px 20px 20px; color: #E0E0E0; border-top: 1px solid rgba(255,255,255,0.05); }
        .footer-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 30px; margin-bottom: 30px; text-align: left; }
        .footer-col h4 { color: var(--pure-white); font-size: 1.2rem; margin-bottom: 15px; font-weight: 400; }
        .footer-col ul { list-style: none; padding: 0; }
        .footer-col ul li { margin-bottom: 10px; font-size: 0.9rem; color: #A0B0C0; display: flex; align-items: center; gap: 10px; }
        .footer-col ul li a { color: #A0B0C0; text-decoration: none; transition: color 0.3s; }
        .footer-col ul li a:hover { color: var(--gold-accent); }
        
        .footer-socials { display: flex; gap: 15px; align-items: center; }
        .social-link svg { fill: var(--gold-accent); transition: fill 0.3s ease; }
        .social-link:hover { transform: scale(1.15); }
        .social-link:hover svg { fill: var(--pure-white); }
        .footer-bottom { text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; }

        @media (max-width: 900px) {
            .hero-gradient { background: linear-gradient(0deg, var(--off-white) 0%, var(--off-white) 55%, rgba(244, 244, 244, 0) 100%); }
            .hero-lara-style { min-height: 100vh; align-items: flex-end; padding-bottom: 60px; }
            .hero-text-content { max-width: 100%; margin-top: 100px; }

            .about-grid, .services-grid, .differentials-grid, .form-row, .choice-buttons { grid-template-columns: 1fr; gap: 30px; }
            .cards-grid { grid-template-columns: 1fr 1fr; }
            .portfolio-grid { grid-template-columns: repeat(2, 1fr); }
            
            header { padding: 15px 20px; }
            .logo { font-size: 1.2rem; }
            .menu-toggle { display: block; }
            
            .nav-links {
                display: none; position: absolute; top: 100%; left: 0; width: 100%;
                background-color: var(--pure-white); flex-direction: column; padding: 20px 0;
                border-bottom: 1px solid var(--light-gray); box-shadow: 0 10px 15px rgba(0,0,0,0.05);
            }
            .nav-links.active { display: flex; }
            .nav-links a { margin: 12px 0; text-align: center; }
            .header-instagram { margin: 12px 0; }

            .form-card { padding: 30px 20px; }
            h1 { font-size: 2.2rem; }
            .section-padding { padding: 70px 20px; }
        }
    </style>
</head>
